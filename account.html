<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account & Billing — KeepIt</title>
  <meta name="description" content="Manage your KeepIt profile, view usage, and manage your Pro subscription.">
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="css/site.css">
</head>

<body>

  <header class="header">
    <div class="header-container">
      <a href="index.html" class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
        </div>
        <span class="brand-title">KeepIt</span>
      </a>
      <nav class="nav-menu">
        <a href="chrome-extension://mhldbdlepccoejdjnhogckbgijohddlg/dashboard.html" target="_blank" rel="noopener noreferrer" data-keepit-cta="dashboard">My Sessions</a>
        <a href="account.html" class="active">Account</a>
        <a href="docs.html">Docs</a>
        <a href="https://chromewebstore.google.com/detail/keepit/mhldbdlepccoejdjnhogckbgijohddlg" target="_blank" rel="noopener noreferrer" class="btn-header" data-keepit-cta="install" data-installed-label="Open Dashboard" style="background: linear-gradient(135deg, var(--accent-primary, #6366f1), var(--accent-hover, #4f46e5)); border: none; color: #fff;">Add to Chrome</a>
        <span id="userMenuContainer"></span>
      </nav>
    </div>
  </header>

  <main class="app-wrapper">
    <div class="page-heading">
      <h1>Account &amp; billing</h1>
      <p>Manage your profile, see your usage, and control your KeepIt Pro subscription.</p>
    </div>

    <div class="account-grid">
      <div class="card">
        <div class="profile-row">
          <div class="profile-avatar" id="profileAvatar"></div>
          <div>
            <h2 id="profileName">—</h2>
            <p id="profileEmail">—</p>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat-box">
            <div class="num" id="statSessions">—</div>
            <div class="label">Cloud sessions</div>
          </div>
          <div class="stat-box">
            <div class="num" id="statFolders">—</div>
            <div class="label">Folders</div>
          </div>
        </div>
        <div class="modal-actions" style="justify-content:flex-start; margin-top:18px;">
          <button class="btn-sm danger" id="accountSignOutBtn" type="button">Sign out</button>
        </div>
      </div>

      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
          <h2 style="font-size:1.1rem; font-weight:700;">Your plan</h2>
          <span class="plan-badge free" id="planBadge">—</span>
        </div>
        <div id="planBody">
          <div class="loading-state" style="padding: 24px 0;">
            <div class="spinner" style="margin: 0 auto 12px;"></div>
            Loading subscription…
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <a href="index.html">Home</a> •
    <a href="docs.html">Documentation</a> •
    <a href="privacy.html">Privacy Policy</a> •
    <a href="terms.html">Terms of Service</a> •
    <a href="terms.html#billing">Refund Policy</a>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/extension-detect.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/account.js"></script>
</body>

</html>
