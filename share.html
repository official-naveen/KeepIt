<!doctype html>
<!--
  KeepIt public share page  ->  deploy to https://keepit.website/share.html  (NOT part of the extension package)

  Two kinds of link open here:
   #v1./#v2.<data>   a one-time snapshot. The whole session lives in the URL fragment (never sent to a server).
   #l.<token>        a LIVE list. The page asks Supabase (function get_live_list, anonymous) every 15 seconds,
                     and the answer is a few bytes when nothing changed. The token is 128 random bits; the
                     database only stores its hash.
  People with KeepIt get "Import / Save a copy" (queued in the extension, confirmed in its popup).
  Everyone else sees the tabs, can open or copy them, and gets an install button.
  Set CHROME_STORE_URL below to your Chrome Web Store listing.
  NOTE: the CSP below pins the inline script/style by SHA-256. After ANY edit of the <script> or <style> text, recompute the hashes (browser console shows the expected hash) or the page will stop working.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-9z/YiggJZre9d6RRr7dsRGF3DqJO1hcHyglsLOaNKCo='; style-src 'sha256-6GBX+TAg5Md3q3PVJ5RQ9BTFyFWNvE7cqXSBWAa5q6E='; connect-src https://srcrhiirseqodxcbikph.supabase.co; img-src data:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
  <title>Shared tabs · KeepIt</title>
  <style>
    :root { color-scheme: light dark; --bg:#f8fafc; --card:#fff; --text:#172033; --muted:#64748b; --accent:#4f46e5; --border:#e2e8f0; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#818cf8; --border:#334155; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
    .card { width:min(680px,100%); padding:28px; border-radius:16px; background:var(--card); border:1px solid var(--border); box-shadow:0 16px 42px #17203318; }
    .brand { font-weight:800; color:var(--accent); letter-spacing:-.04em; font-size:20px; }
    h1 { margin:14px 0 4px; font-size:22px; word-break:break-word; }
    #details, .note { color:var(--muted); font-size:14px; }
    ol { max-height:320px; overflow:auto; padding-left:22px; margin:16px 0; }
    li { margin:8px 0; word-break:break-word; }
    li small { display:block; color:var(--muted); font-size:12px; }
    a { color:var(--accent); }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
    button, .btn { border:0; border-radius:8px; background:var(--accent); color:#fff; padding:10px 14px; font-weight:700; font-size:14px; cursor:pointer; text-decoration:none; display:inline-block; }
    button.secondary, .btn.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
    button:disabled { opacity:.6; cursor:default; }
    [hidden] { display:none !important; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; background:#10b98122; color:#10b981; }
    .pill::before { content:''; width:8px; height:8px; border-radius:50%; background:currentColor; animation:pulse 2s infinite; }
    .pill.ended { background:#ef444422; color:#ef4444; } .pill.ended::before { animation:none; }
    @keyframes pulse { 50% { opacity:.3; } }
    em.note { display:block; margin-top:2px; font-size:12px; color:var(--muted); font-style:normal; white-space:pre-wrap; }
    .snote { margin:10px 0 0; padding:8px 12px; border-left:3px solid var(--accent); color:var(--muted); font-size:14px; white-space:pre-wrap; }
    #msg { margin-top:12px; font-size:14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">KeepIt</div>
    <p id="status">Opening shared tabs…</p>
    <section id="preview" hidden>
      <h1 id="title"></h1>
      <p id="details"></p>
      <p id="snote" class="snote" hidden></p>
      <ol id="tabs"></ol>
      <div class="actions">
        <button id="openall" type="button">Open all tabs</button>
        <button id="import" class="secondary" type="button" hidden>Import into KeepIt</button>
        <a id="install" class="btn secondary" href="#" rel="noopener noreferrer" hidden>Get KeepIt (free)</a>
        <button id="copy" class="secondary" type="button">Copy links</button>
      </div>
      <p id="msg" role="status"></p>
      <p class="note">Anyone with this link can see these tab titles and addresses. Only open links from people you trust.</p>
    </section>
  </main>
  <script>
  (() => {
    const CHROME_STORE_URL = 'https://chromewebstore.google.com/detail/keepit/mhldbdlepccoejdjnhogckbgijohddlg';
    const SUPABASE_URL = 'https://srcrhiirseqodxcbikph.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNyY3JoaWlyc2Vxb2R4Y2Jpa3BoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NzkxMDIsImV4cCI6MjEwMTE1NTEwMn0.JY6J50hfVo6kbQWoKLhNqgLka1Aga1G1J4Vn2eNizpw'; // public by design (it is also inside the extension); data access is controlled by the SQL functions
    const MAX_TABS = 500, POLL_MS = 15000, POLL_CAP_MS = 60 * 60 * 1000;
    const $ = (id) => document.getElementById(id);

    const fromB64Url = (value) => {
      const b64 = value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - value.length % 4) % 4);
      const bin = atob(b64); const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    };

    const MAX_DECODED_BYTES = 2 * 1024 * 1024;   // guards against decompression bombs in #v2 links
    async function decodeFragment(fragment) {
      const dot = fragment.indexOf('.');
      if (dot < 1) throw new Error('bad fragment');
      const version = fragment.slice(0, dot), body = fragment.slice(dot + 1);
      if (!/^[A-Za-z0-9_-]+={0,2}$/.test(body)) throw new Error('bad encoding');
      let bytes = fromB64Url(body);
      if (version === 'v2') {
        const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader();
        const chunks = []; let total = 0;
        for (;;) {
          const r = await reader.read();
          if (r.done) break;
          total += r.value.length;
          if (total > MAX_DECODED_BYTES) { reader.cancel().catch(() => {}); throw new Error('too large'); }
          chunks.push(r.value);
        }
        bytes = new Uint8Array(total); let off = 0;
        chunks.forEach((c) => { bytes.set(c, off); off += c.length; });
      } else if (version !== 'v1') { throw new Error('unknown version'); }
      else if (bytes.length > MAX_DECODED_BYTES) { throw new Error('too large'); }
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    const cleanNote = (v) => String(v == null ? '' : v).trim().slice(0, 500);
    function cleanSession(raw) {
      if (!raw || !Array.isArray(raw.tabs)) return null;
      const tabs = raw.tabs.slice(0, MAX_TABS).map((t) => {
        try {
          const u = new URL(t && t.url);
          if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
          const tab = { url: u.href, title: String((t && t.title) || u.href).slice(0, 300), pinned: !!(t && t.pinned),
                        sessionGroupId: t && typeof t.sessionGroupId === 'string' ? t.sessionGroupId : null };
          if (cleanNote(t && t.note)) tab.note = cleanNote(t.note);
          return tab;
        } catch (_) { return null; }
      }).filter(Boolean);
      if (!tabs.length) return null;
      const out = { name: String(raw.name || 'Shared session').slice(0, 80), tabs, groups: Array.isArray(raw.groups) ? raw.groups.slice(0, 50).filter((g) => g && typeof g === 'object' && !Array.isArray(g)) : [] };
      if (raw.note) out.note = String(raw.note).trim().slice(0, 2000);
      return out;
    }

    let current = null, live = null;       // current session being shown; live = { token, updatedAt, timer, started, ended }

    function ago(iso) {
      const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
      return s < 20 ? 'just now' : s < 90 ? s + ' s ago' : s < 5400 ? Math.round(s / 60) + ' min ago' : s < 129600 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' days ago';
    }

    function render(session) {
      current = session;
      $('status').hidden = true; $('preview').hidden = false;
      $('title').textContent = session.name;
      $('snote').hidden = !session.note; $('snote').textContent = session.note || '';
      const list = $('tabs'); list.textContent = '';
      session.tabs.forEach((tab) => {
        const li = document.createElement('li');
        const a = document.createElement('a'); a.href = tab.url; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow'; a.textContent = tab.title;
        const host = document.createElement('small'); host.textContent = new URL(tab.url).hostname;
        li.append(a, host);
        if (tab.note) { const n = document.createElement('em'); n.className = 'note'; n.textContent = tab.note; li.appendChild(n); }
        list.appendChild(li);
      });
      renderDetails();
    }

    function renderDetails() {
      const d = $('details'); d.textContent = '';
      const count = current.tabs.length + (current.tabs.length === 1 ? ' tab' : ' tabs');
      if (live) {
        const pill = document.createElement('span'); pill.className = 'pill' + (live.ended ? ' ended' : ''); pill.textContent = live.ended ? 'Ended' : 'Live';
        d.append(pill, document.createTextNode(live.ended ? ' This list was revoked or has expired · last seen ' + count
          : ' ' + count + ' · updated ' + ago(live.updatedAt) + (live.paused ? ' · paused, reload to resume' : ' · refreshes automatically')));
      } else { d.textContent = count + ' · no account needed'; }
    }

    async function fetchLive() {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_live_list', {
        method: 'POST', headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_token: live.token, p_since: live.updatedAt })
      });
      if (!res.ok) throw new Error('http ' + res.status);
      return res.json();
    }

    async function pollLive(first) {
      if (live.ended || (document.hidden && !first)) return;
      if (Date.now() - live.started > POLL_CAP_MS) { live.paused = true; clearInterval(live.timer); renderDetails(); return; }  // protects the free tier from forgotten tabs
      try {
        const data = await fetchLive();
        if (data.status === 'gone') {
          live.ended = true; clearInterval(live.timer);
          if (!current) { $('status').textContent = 'This live list has ended or the link is not valid.'; return; }
        } else if (data.status === 'ok') {
          live.updatedAt = data.updated_at;
          const session = cleanSession({ name: data.title, tabs: data.items });
          if (session) render(session); else { live.ended = true; }
        }
        if (current) renderDetails();
      } catch (_) {
        if (!current) $('status').textContent = 'Could not load this live list. Check your connection and reload.';
      }
    }

    function setupActions() {
      $('copy').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(current.tabs.map((t) => t.url).join('\n')); $('msg').textContent = 'Links copied.'; }
        catch (_) { $('msg').textContent = 'Could not copy automatically.'; }
      });
      $('openall').addEventListener('click', () => {
        const n = current.tabs.length;
        if (n > 15 && !confirm('Open ' + n + ' tabs?')) return;
        let blocked = 0;
        current.tabs.forEach((t) => { if (!window.open(t.url, '_blank', 'noopener,noreferrer')) blocked++; });
        $('msg').textContent = blocked ? 'Your browser blocked ' + blocked + ' tab(s). Allow pop-ups for this page and try again.' : '';
      });
      let hasExtension = false;
      window.addEventListener('message', (event) => {
        if (event.source !== window || event.origin !== window.location.origin || !event.data) return;
        if (event.data.type === 'MY_EXTENSION_PRESENT') hasExtension = true;
        if (event.data.type === 'KEEPIT_IMPORT_RESULT') {
          $('import').disabled = false;
          $('msg').textContent = event.data.ok ? 'Sent! Open the KeepIt extension and confirm.' : (event.data.error || 'Could not import. Is KeepIt enabled?');
        }
      });
      window.postMessage({ type: 'CHECK_MY_EXTENSION' }, window.location.origin);
      setTimeout(() => {
        if (hasExtension) { $('import').hidden = false; if (live) $('import').textContent = 'Save a copy in KeepIt'; }
        else { const i = $('install'); i.href = CHROME_STORE_URL; i.hidden = false; }
      }, 700);
      $('import').addEventListener('click', () => { $('import').disabled = true; window.postMessage({ type: 'KEEPIT_IMPORT_SHARE', session: current }, window.location.origin); });
    }

    (async () => {
      const fragment = location.hash.slice(1);
      setupActions();
      const liveMatch = fragment.match(/^l\.([0-9a-f]{32})$/i);
      if (liveMatch) {
        live = { token: liveMatch[1].toLowerCase(), updatedAt: null, started: Date.now(), ended: false, paused: false, timer: null };
        $('status').textContent = 'Opening live list…';
        await pollLive(true);
        if (!live.ended || current) live.timer = setInterval(() => pollLive(false), POLL_MS);
        document.addEventListener('visibilitychange', () => { if (!document.hidden && live && !live.ended) pollLive(true); });
        setInterval(() => { if (current && live && !live.ended && !live.paused) renderDetails(); }, 5000);   // keep "updated X ago" fresh
        return;
      }
      try {
        if (!fragment || fragment.length > 200000) throw new Error('empty');
        const payload = await decodeFragment(fragment);
        if (payload.format !== 'keepit-share' || payload.version !== 1) throw new Error('bad payload');
        const session = cleanSession(payload.session);
        if (!session) throw new Error('no tabs');
        render(session);
      } catch (_) { $('status').textContent = 'This share link is invalid or has been damaged.'; }
    })();
  })();
  </script>
</body>
</html>
